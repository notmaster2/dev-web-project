<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>giveaway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <span>giveaway</span>
        <a href="index.html" target="_self">
            <img class="theme-icon" src="images/light.png" alt="Toggle Theme">
        </a>
    </header>

    <main>
        <h1 class="form-heading">Complete your information</h1>
        <form class="form-container">
            <section class="input-group">
                <div class="form-field">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname">
                </div>
                <div class="form-field">
                    <label for="emailAddress">your adress</label>
                    <input type="email" id="emailAddress" name="email">
                </div>
                <div class="form-field">
                    <label for="contactNumber">Contact us</label>
                    <input type="tel" id="contactNumber" name="phone">
                </div>
            </section>
            <div class="submit-section">
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
